app = "senaite-lims"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  SITE_ID = "senaite"
  ADMIN_USER = "admin"
  ADMIN_PASSWORD = "admin"

[[mounts]]
  source = "senaite_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
